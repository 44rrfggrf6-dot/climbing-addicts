<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="300" height="250" role="img" aria-label="Recolte de prise, visage qui rit">
  <rect width="300" height="250" fill="#0D0F14"/>
  <!-- jug 0-1s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.15;0.2" dur="5s" repeatCount="indefinite"/>
    <ellipse cx="150" cy="105" rx="52" ry="44" fill="#FF7A1A"/>
    <ellipse cx="150" cy="105" rx="18" ry="14" fill="#0D0F14"/>
    <ellipse cx="132" cy="88" rx="20" ry="14" fill="#FFA45C" opacity="0.9"/>
  </g>
  <!-- crimp 1-2s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.2;0.25;0.35;0.4" dur="5s" repeatCount="indefinite"/>
    <rect x="95" y="89" width="110" height="32" rx="10" fill="#2DD4BF"/>
    <rect x="95" y="89" width="110" height="14" rx="7" fill="#99F6E4"/>
  </g>
  <!-- sloper 2-3s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.4;0.45;0.55;0.6" dur="5s" repeatCount="indefinite"/>
    <path d="M95,125 A55,48 0 0 1 205,125 L205,130 L95,130 Z" fill="#39404C"/>
    <ellipse cx="122" cy="95" rx="14" ry="10" fill="#7B8496"/>
  </g>
  <!-- pinch 3-4s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.6;0.65;0.75;0.8" dur="5s" repeatCount="indefinite"/>
    <rect x="128" y="57" width="44" height="96" rx="12" fill="#FF7A1A"/>
    <rect x="128" y="57" width="18" height="96" rx="9" fill="#FFA45C"/>
  </g>
  <!-- volume 4-5s -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0.8;0.85;0.95;1" dur="5s" repeatCount="indefinite"/>
    <polygon points="150,55 205,140 95,140" fill="#2E333D" stroke="#FF7A1A" stroke-width="4"/>
    <polygon points="150,55 205,140 150,140" fill="#3E4450"/>
  </g>
  <!-- sparkles +10 -->
  <g fill="#2DD4BF" opacity="0">
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.5;1" dur="1s" repeatCount="indefinite"/>
    <circle cx="100" cy="70" r="3"/><circle cx="205" cy="80" r="3"/><circle cx="195" cy="150" r="3"/><circle cx="105" cy="150" r="3"/>
  </g>
  <text x="188" y="70" font-family="Arial,sans-serif" font-weight="bold" font-size="20" fill="#fff" opacity="0">+10
    <animate attributeName="opacity" values="0;1;0" keyTimes="0;0.3;1" dur="1s" repeatCount="indefinite"/>
    <animate attributeName="y" values="80;60" dur="1s" repeatCount="indefinite"/>
  </text>
  <!-- visage qui rit (secousse de rire en boucle) -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-4;0,0;0,-2;0,0" keyTimes="0;0.25;0.5;0.75;1" dur="0.6s" repeatCount="indefinite"/>
    <polygon points="128,150 122,118 132,122 140,140" fill="#FFA45C"/>
    <polygon points="172,150 178,118 168,122 160,140" fill="#FFA45C"/>
    <polygon points="118,158 182,158 190,182 176,204 124,204 110,182" fill="#FF7A1A"/>
    <polygon points="150,158 182,158 190,182 176,204 150,202" fill="#E86A12"/>
    <polyline points="124,176 132,166 140,176" fill="none" stroke="#12151B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <polyline points="160,176 168,166 176,176" fill="none" stroke="#12151B" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g>
      <animateTransform attributeName="transform" type="scale" values="1,1;1,1.25;1,1" keyTimes="0;0.5;1" dur="0.6s" repeatCount="indefinite"/>
      <polygon points="132,188 168,188 163,206 137,206" fill="#12151B"/>
      <polygon points="132,188 168,188 166,194 134,194" fill="#FFFFFF"/>
      <ellipse cx="150" cy="202" rx="7" ry="4" fill="#2DD4BF"/>
    </g>
  </g>
  <text x="12" y="234" font-family="monospace" font-size="13" fill="#7A828F">jug • crimp • sloper • pinch • volume</text>
</svg>
