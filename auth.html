<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Se connecter — Climbing Addicts</title>
  <meta name="description" content="Connecte-toi à Climbing Addicts pour suivre ta progression en escalade.">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/images/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/images/apple-touch-icon.png">
  <link rel="manifest" href="assets/site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="auth-page">
  <a href="index.html" class="auth-logo logo" aria-label="Climbing Addicts Home">
    <img src="assets/images/logo-ecusson-notext.svg" alt="" width="48" height="52">
    <span class="logo-text">
      <span class="logo-climbing">CLIMBING</span>
      <span class="logo-addicts">ADDICTS</span>
    </span>
  </a>

  <main class="auth-card">
    <h1 data-i18n="auth.title.signin" data-auth-title-signin>Bon retour</h1>
    <h1 data-i18n="auth.title.signup" data-auth-title-signup hidden>Créer un compte</h1>

    <form id="auth-form" novalidate>
      <div class="auth-field">
        <label for="auth-email" data-i18n="auth.label.email">Email</label>
        <input type="email" id="auth-email" name="email" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="auth-password" data-i18n="auth.label.password">Mot de passe</label>
        <input type="password" id="auth-password" name="password" autocomplete="current-password" required minlength="8">
      </div>
      <div class="auth-field" data-auth-confirm hidden>
        <label for="auth-confirm" data-i18n="auth.label.confirm">Confirmer le mot de passe</label>
        <input type="password" id="auth-confirm" name="confirm" autocomplete="new-password" minlength="8">
      </div>

      <p class="auth-message" data-auth-message hidden></p>

      <button type="submit" class="btn btn-primary auth-submit" data-i18n="auth.button.signin" data-auth-submit-signin>Se connecter</button>
    </form>

    <div class="auth-divider" data-i18n="auth.divider">ou</div>

    <button type="button" class="btn btn-secondary auth-google" id="auth-google">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.9v2.33A9 9 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.66 9c0-.59.1-1.17.29-1.7V4.97H.9A9 9 0 0 0 0 9c0 1.45.35 2.83.9 4.03l3.05-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.51.46 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .9 4.97l3.05 2.33C4.66 5.17 6.65 3.58 9 3.58z"/></svg>
      <span data-i18n="auth.google">Continuer avec Google</span>
    </button>

    <p class="auth-note" data-i18n="auth.note">Cette page est une démo — elle n'est pas encore reliée à un vrai compte. Télécharge l'app pour créer le tien.</p>

    <p class="auth-switch">
      <span data-auth-switch-signup>
        <span data-i18n="auth.switch.toSignup.text">Nouveau ici ?</span>
        <a href="#" data-auth-toggle data-i18n="auth.switch.toSignup.link">Créer un compte</a>
      </span>
      <span data-auth-switch-signin hidden>
        <span data-i18n="auth.switch.toSignin.text">Déjà un compte ?</span>
        <a href="#" data-auth-toggle data-i18n="auth.switch.toSignin.link">Se connecter</a>
      </span>
    </p>
  </main>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
